
name: Build Herb Patch Colors

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: herbpatch-overlay-master

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: bash ./gradlew clean build --no-daemon

      - name: Upload compiled plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: herb-patch-colors-build
          path: herbpatch-overlay-master/build/libs/*.jar
          if-no-files-found: error
